apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine-prd
  namespace: prd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: affine-prd
  template:
    metadata:
      labels:
        app: affine-prd
    spec:
      containers:
      - env:
        - name: AFFINE_CONFIG_PATH
          value: /root/.affine/config
        - name: REDIS_SERVER_HOST
          value: redis-affine-prd
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: affine-secret-prd
              key: DATABASE_URL
        - name: NODE_ENV
          value: production
        - name: AFFINE_ADMIN_EMAIL
          value: proto@khi.fi.it
        - name: AFFINE_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: affine-secret-prd
              key: AFFINE_ADMIN_PASSWORD
        - name: AFFINE_SERVER_HOST
          value: semantic.khi.fi.it
        - name: AFFINE_SERVER_EXTERNAL_URL
          value: https://semantic.khi.fi.it
        - name: AFFINE_SERVER_HTTPS
          value: 'true'
        - name: SERVER_FLAVOR
          value: allinone
        - name: MAILER_HOST
          value: 192.168.170.20
        - name: MAILER_PORT
          value: '25'
        - name: MAILER_USER
          value: proto@khi.fi.it
        - name: MAILER_PASSWORD
        - name: MAILER_SENDER
          value: proto@khi.fi.it
        - name: MAILER_IGNORE_TLS
          value: 'true'
        - name: AFFINE_INDEXER_ENABLED
          value: 'false'
        image: ghcr.io/toeverything/affine:0.24.0
        name: affine-prd
        ports:
        - containerPort: 3010
        volumeMounts:
        - mountPath: /root/.affine/config
          name: affine-prd-config
        - mountPath: /root/.affine/storage
          name: affine-prd-storage
      imagePullSecrets:
      - name: ghcr-secret
      volumes:
      - name: affine-prd-config
        nfs:
          path: /home/shared/affine/config
          server: 192.168.170.200
      - name: affine-prd-storage
        nfs:
          path: /home/shared/affine/storage
          server: 192.168.170.200
