apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 999999999m
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.org/client-max-body-size: 999999999m
  name: affine-ingress-prd
  namespace: prd
spec:
  ingressClassName: nginx
  rules:
  - host: semantic.khi.fi.it
    http:
      paths:
      - backend:
          service:
            name: affine-svc-prd
            port:
              number: 3010
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - dhlab.khi.fi.it
    - exhibitions.khi.fi.it
    - dante.khi.fi.it
    - ebooks.khi.fi.it
    - virtualphotothek.khi.fi.it
    - futurismo.khi.fi.it
    - semantic.khi.fi.it
    - researchdb.khi.fi.it
    - iiif.khi.fi.it
    - integration.khi.fi.it
    secretName: app-tls
