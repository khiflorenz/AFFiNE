# config.json of the new prd stack. A Secret (not a ConfigMap) because the S3 credentials live inside.
# Mounted at /root/.affine/config/config.json. Precedence: defaults <- env <- this file <- Admin Panel
# (app_configs in the DB — avoid the Admin Panel until the cutover: the DB is re-restored then).
#
# VALIDATION PHASE (served at integration.khi.fi.it): keep "mailer" OUT so the copy of prd data cannot
# e-mail real users with integration links. CUTOVER: set server.host/externalUrl to semantic.khi.fi.it
# and add the mailer block (values below, commented).
apiVersion: v1
kind: Secret
metadata:
  name: affine2-config-prd
  namespace: prd
type: Opaque
stringData:
  config.json: |
    {
      "$schema": "https://github.com/toeverything/affine/releases/download/v0.27.4/config.schema.json",
      "server": { "name": "KHI AFFINE", "host": "integration.khi.fi.it", "https": true, "externalUrl": "https://integration.khi.fi.it" },
      "storages": {
        "blob": {
          "storage": {
            "provider": "aws-s3",
            "bucket": "khi-affine-prd",
            "config": {
              "endpoint": "https://s3.nexus.mpcdf.mpg.de",
              "region": "default",
              "forcePathStyle": true,
              "credentials": { "accessKeyId": "<nexus access key>", "secretAccessKey": "<nexus secret key>" },
              "presign": { "expiresInSeconds": 3600 },
              "usePresignedURL": { "enabled": false }
            }
          }
        },
        "avatar": {
          "publicPath": "/api/avatars/",
          "storage": { "provider": "fs", "bucket": "avatars", "config": { "path": "~/.affine/storage" } }
        }
      },
      "indexer": { "enabled": false },
      "copilot": { "enabled": true },
      "job": { "queue": { "attempts": 5, "backoff": { "type": "exponential", "delay": 1000 }, "removeOnComplete": true, "removeOnFail": true } }
    }
  # cutover additions (merge into config.json above):
  #   "server": { "name": "KHI AFFINE", "host": "semantic.khi.fi.it", "https": true, "externalUrl": "https://semantic.khi.fi.it" },
  #   "mailer": { "SMTP": { "name": "semantic.khi.fi.it", "host": "192.168.170.20", "port": 25, "username": "proto@khi.fi.it", "sender": "proto@khi.fi.it", "ignoreTLS": true } },
