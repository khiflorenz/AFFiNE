# New prd stack (DL-887 blue/green): upstream image, config.json from a Secret, blobs on Nexus S3,
# only avatars (72 KB) on a new NFS dir. No legacy config dir, no imagePullSecret (public image).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine2-prd
  namespace: prd
  labels:
    app: affine2-prd
spec:
  replicas: 1
  strategy:
    type: Recreate   # single Redis/DB consumer; avoids two servers running nightly jobs at once
  selector:
    matchLabels:
      app: affine2-prd
  template:
    metadata:
      labels:
        app: affine2-prd
    spec:
      containers:
      - name: affine
        image: ghcr.io/toeverything/affine:0.27.4@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
        env:
        - name: NODE_ENV
          value: production
        - name: SERVER_FLAVOR
          value: allinone
        - name: REDIS_SERVER_HOST
          value: redis-affine2-prd
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: affine2-secret-prd
              key: DATABASE_URL
        - name: MAILER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: affine2-secret-prd
              key: MAILER_PASSWORD
        ports:
        - containerPort: 3010
        readinessProbe:
          httpGet:
            path: /info
            port: 3010
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            memory: 3Gi
        volumeMounts:
        - name: config
          mountPath: /root/.affine/config
        - name: config-json
          mountPath: /root/.affine/config/config.json
          subPath: config.json
          readOnly: true
        - name: storage
          mountPath: /root/.affine/storage
      volumes:
      - name: config
        emptyDir: {}
      - name: config-json
        secret:
          secretName: affine2-config-prd
      - name: storage
        nfs:
          path: /home/shared/affine/prd-v2/storage
          server: 192.168.170.200
