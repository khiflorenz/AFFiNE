# Validation phase: integration.khi.fi.it (freed from hml). Cutover: change `host` to semantic.khi.fi.it
# (and delete the old affine-ingress-prd first — two Ingresses with the same host are refused/undefined).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: affine2-ingress-prd
  namespace: prd
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2048m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
  - host: integration.khi.fi.it
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: affine2-svc-prd
            port:
              number: 3010
  tls:
  - hosts:
    - integration.khi.fi.it
    - semantic.khi.fi.it
    secretName: app-tls
