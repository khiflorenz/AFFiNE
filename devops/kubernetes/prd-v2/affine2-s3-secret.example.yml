# Nexus S3 key used by blob-copy-job.yml (aws cli). The server itself reads the same key from
# config.json (affine2-config-secret). Template only.
apiVersion: v1
kind: Secret
metadata:
  name: affine2-s3-prd
  namespace: prd
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: <nexus access key>
  AWS_SECRET_ACCESS_KEY: <nexus secret key>
