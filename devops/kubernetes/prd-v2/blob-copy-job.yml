# Copies the blob files of the OLD prd stack (NFS, read-only) into the Nexus bucket and sets each
# object's Content-Type from the new DB's `blobs.mime` (S3 object Content-Type is what the browser
# gets, since the server answers blob GETs with a 302 to a presigned URL). Idempotent (`s3 sync`):
# run once for the bulk copy, again at the cutover for the delta. Needs affine2-s3-prd + affine2-secret-prd.
apiVersion: batch/v1
kind: Job
metadata:
  name: affine2-blob-copy
  namespace: prd
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      initContainers:
      - name: mimes
        image: docker.io/library/postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        command: ["/bin/sh", "-ec"]
        args:
          - psql "$DATABASE_URL" -Atc "select workspace_id || '/' || key || E'\t' || mime from blobs where deleted_at is null and mime <> ''" > /work/mimes.tsv; wc -l /work/mimes.tsv
        env:
        - name: DATABASE_URL
          valueFrom: { secretKeyRef: { name: affine2-secret-prd, key: DATABASE_URL } }
        volumeMounts:
        - { name: work, mountPath: /work }
      containers:
      - name: copy
        image: amazon/aws-cli:2.22.35
        command: ["/bin/sh", "-ec"]
        args:
          - |
            E=https://s3.nexus.mpcdf.mpg.de; B=khi-affine-prd
            echo "== sync files (keys = <workspaceId>/<key>)"
            aws --endpoint-url $E s3 sync /old/blobs s3://$B/ --no-progress --only-show-errors
            echo "== set Content-Type from blobs.mime ($(wc -l < /work/mimes.tsv) rows)"
            n=0; while IFS="$(printf '\t')" read -r key mime; do
              aws --endpoint-url $E s3api copy-object --bucket $B --key "$key" --copy-source "$B/$key" \
                --content-type "$mime" --metadata-directive REPLACE >/dev/null 2>&1 || echo "skip $key ($mime)"
              n=$((n+1)); [ $((n % 100)) -eq 0 ] && echo "$n done"
            done < /work/mimes.tsv
            echo "== objects in bucket: $(aws --endpoint-url $E s3 ls s3://$B/ --recursive | wc -l)"
        env:
        - name: AWS_DEFAULT_REGION
          value: default
        - name: AWS_ACCESS_KEY_ID
          valueFrom: { secretKeyRef: { name: affine2-s3-prd, key: AWS_ACCESS_KEY_ID } }
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: { secretKeyRef: { name: affine2-s3-prd, key: AWS_SECRET_ACCESS_KEY } }
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { memory: 1Gi }
        volumeMounts:
        - { name: old, mountPath: /old, readOnly: true }
        - { name: work, mountPath: /work }
      volumes:
      - name: old
        nfs: { server: 192.168.170.200, path: /home/shared/affine/storage, readOnly: true }
      - name: work
        emptyDir: {}
