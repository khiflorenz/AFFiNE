# Discord webhook for affine2-nightly-watchdog-prd. Template only — never apply this file as is.
# Optional: without the Secret the watchdog still runs and only logs. Live value = the same
# webhook used by hml-capacity-guard / k3s-health-discord:
#   kubectl -n kube-system get secret hml-capacity-guard-discord -o jsonpath='{.data.DISCORD_WEBHOOK_URL}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: affine2-watchdog-discord-prd
  namespace: prd
type: Opaque
stringData:
  DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/CHANGE_ME"
