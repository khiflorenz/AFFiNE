apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: affine-ingress-hml
  namespace: hml
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 999999999m
    nginx.org/client-max-body-size: 999999999m
spec:
  ingressClassName: nginx
  rules:
  - host: integration.khi.fi.it
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: affine-svc-hml
            port:
              number: 3010
  tls:
  - hosts:
    - integration.khi.fi.it
    secretName: app-tls
