apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: postgres-affine-hml
  name: postgres-affine-hml
  namespace: hml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-affine-hml
  template:
    metadata:
      labels:
        app: postgres-affine-hml
    spec:
      containers:
      - env:
        - name: POSTGRES_USER
          value: affine
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-affine-secret-hml
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: affine
        image: postgres:16
        name: postgres
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-affine-hml-storage
      priorityClassName: hml-database-priority
      terminationGracePeriodSeconds: 120
      volumes:
      - name: postgres-affine-hml-storage
        nfs:
          path: /home/shared/affine/AFFiNE.pro/hml/postgres
          server: 192.168.170.200
