apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine-hml
  namespace: hml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: affine-hml
  template:
    metadata:
      labels:
        app: affine-hml
    spec:
      containers:
      - env:
        - name: REDIS_SERVER_HOST
          value: redis-affine-hml
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: affine-secret-hml
              key: DATABASE_URL
        - name: NODE_ENV
          value: production
        - name: SERVER_FLAVOR
          value: allinone
        - name: MAILER_PASSWORD
        image: ghcr.io/toeverything/affine:0.27.4
        name: affine-hml
        ports:
        - containerPort: 3010
        volumeMounts:
        - mountPath: /root/.affine/config
          name: affine-hml-config
        - mountPath: /root/.affine/storage
          name: affine-hml-storage
        - name: affine-config-json
          mountPath: /root/.affine/config/config.json
          subPath: config.json
          readOnly: true
      volumes:
      - name: affine-hml-config
        nfs:
          path: /home/shared/affine/AFFiNE.pro/hml/config
          server: 192.168.170.200
      - name: affine-hml-storage
        nfs:
          path: /home/shared/affine/AFFiNE.pro/hml/storage
          server: 192.168.170.200
      - name: affine-config-json
        configMap:
          name: affine-config-hml
